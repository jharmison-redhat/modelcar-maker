[project]
name = "modelcar-pydantic-settings-spike"
version = "0.0.0"
requires-python = ">=3.11"
dependencies = [
  "pydantic-settings>=2.0,<3",
]

[project.optional-dependencies]
test = ["pytest>=8,<10", "ruff>=0.8,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.format]
quote-style = "double"
