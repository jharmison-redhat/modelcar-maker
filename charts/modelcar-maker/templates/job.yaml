{{- $needsClusterCa := .Values.certificateAuthorities.openshiftClusterCa }}
{{- $needsServiceCa := eq .Values.modelcar.image.registry "image-registry.openshift-image-registry.svc:5000" }}
{{- $needsCustomCa := ne "" .Values.certificateAuthorities.custom }}
{{- $needsCa := or $needsCustomCa (or $needsClusterCa $needsServiceCa) }}
{{- $needsAuthfile := not .Values.modelcar.dockerConfigJson }}
{{- if .Values.models }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "modelcar-maker.job-name" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "modelcar-maker.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
spec:
  backoffLimit: {{ .Values.backoffLimit }}
  template:
    metadata:
      labels:
        {{- include "modelcar-maker.labels" . | nindent 8 }}
      annotations:
        {{- include "modelcar-maker.podAnnotations" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "modelcar-maker.serviceAccountName" . }}
      restartPolicy: Never
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- if or $needsCa $needsAuthfile }}
      initContainers:
        {{- if $needsCa }}
        - name: ca-bundle-maker
          image: {{ include "modelcar-maker.image-name" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - /bin/sh
          args:
            - -c
            - update-ca-trust extract --output /extracted
          volumeMounts:
            {{- if $needsServiceCa }}
            - name: service-ca
              mountPath: /etc/pki/ca-trust/source/anchors/service-ca.crt
              subPath: service-ca.crt
            {{- end }}
            {{- if $needsClusterCa }}
            - name: cluster-ca
              mountPath: /etc/pki/ca-trust/source/anchors/ca-bundle.crt
              subPath: ca-bundle.crt
            {{- end }}
            {{- if $needsCustomCa }}
            - name: custom-ca
              mountPath: /etc/pki/ca-trust/source/anchors/custom-ca.crt
              subPath: custom-ca.crt
            {{- end }}
            - name: extracted-cas
              mountPath: /extracted
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
        {{- end }}
        {{- if $needsAuthfile }}
        - name: authfile-builder
          image: {{ include "modelcar-maker.image-name" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - /bin/sh
          args:
            - -c
            - |-
              token="$(cat /var/run/secrets/kubernetes.io/serviceaccount/token)"
              auth_string="$(echo -n "serviceaccount:${token}" | base64 -w0)"
              umask 077
              mkdir -p /registry-credentials/.docker
              cat << EOF > /registry-credentials/.docker/config.json
              {
                "auths": {
                  "{{ .Values.modelcar.image.registry }}": {
                    "auth": "${auth_string}"
                  }
                }
              }
              EOF
              chmod 600 /registry-credentials/.docker/config.json
          volumeMounts:
            - name: registry-credentials
              mountPath: /registry-credentials
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
        {{- end }}
      {{- end }}
      containers:
        - name: modelcar-maker
          image: {{ include "modelcar-maker.image-name" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - modelcar-maker
          args: []
          env:
            - name: HOME
              value: /modelcar-maker
            - name: REQUESTS_CA_BUNDLE
              value: /etc/pki/ca-trust/extracted/openssl/ca-bundle.trust.crt
            - name: SSL_CERT_FILE
              value: /etc/pki/ca-trust/extracted/openssl/ca-bundle.trust.crt
            - name: CURL_CA_BUNDLE
              value: /etc/pki/ca-trust/extracted/openssl/ca-bundle.trust.crt
            {{- range $k, $v := .Values.modelcar.env }}
            - name: {{ $k }}
              value: {{ quote $v }}
            {{- end }}
          envFrom:
            - secretRef:
                name: {{ include "modelcar-maker.fullname" . }}
                optional: true
          workingDir: /modelcar-maker
          volumeMounts:
            - name: config
              mountPath: /etc/modelcar-maker
            - name: workspace
              mountPath: /modelcar-maker
            {{- if .Values.modelcar.dockerConfigJson }}
            - name: push-secret
              mountPath: /modelcar-maker/.docker/config.json
              subPath: config.json
            {{- end }}
            {{- if $needsAuthfile }}
            - name: registry-credentials
              mountPath: /modelcar-maker/.docker
            {{- end }}
            {{- if $needsCa }}
            - name: extracted-cas
              mountPath: /etc/pki/ca-trust/extracted
              readOnly: true
            {{- end }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      volumes:
        - name: config
          configMap:
            name: {{ include "modelcar-maker.fullname" . }}
        - name: workspace
          {{- if eq .Values.workspace.type "emptyDir" }}
          {{- if .Values.workspace.emptyDir }}
          emptyDir:
            {{- toYaml .Values.workspace.emptyDir | nindent 12 }}
          {{- else }}
          emptyDir: {}
          {{- end }}
          {{- else if eq .Values.workspace.type "pvc" }}
          persistentVolumeClaim:
            claimName: {{ include "modelcar-maker.fullname" . }}
          {{- end }}
        {{- if .Values.modelcar.dockerConfigJson }}
        - name: push-secret
          secret:
            secretName: {{ include "modelcar-maker.fullname" . }}-push
            items:
              - key: .dockerconfigjson
                path: config.json
        {{- end }}
        {{- if $needsAuthfile }}
        - name: registry-credentials
          emptyDir:
            medium: Memory
        {{- end }}
        {{- if $needsCa }}
        - name: extracted-cas
          emptyDir: {}
        {{- if $needsServiceCa }}
        - name: service-ca
          configMap:
            name: {{ include "modelcar-maker.fullname" . }}-service-ca
        {{- end }}
        {{- if $needsClusterCa }}
        - name: cluster-ca
          configMap:
            name: {{ include "modelcar-maker.fullname" . }}-cluster-ca
        {{- end }}
        {{- if $needsCustomCa }}
        - name: custom-ca
          configMap:
            name: {{ include "modelcar-maker.fullname" . }}-custom-ca
        {{- end }}
        {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
