name: Pull Request Checks

on:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install tox
      - run: tox run -e lint,mypy,pyright

  unit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - python: "3.11"
            toxenv: py311
          - python: "3.12"
            toxenv: py312
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install tox
      - run: tox run -e ${{ matrix.toxenv }}

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install tox
      - run: tox run -e build

  chart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v4
      - run: python -m pip install tox
      - run: tox run -e chart
