[tox]
skipsdist = True
envlist = py311,py312,lint,mypy,pyright,build,chart

[common]
format_dirs = {toxinidir}/src {toxinidir}/tests {toxinidir}/scripts {toxinidir}/spikes/pydantic_settings

[testenv]
description = Run the fast unit test-suite
deps =
  -e .[dev]
commands = pytest -v --log-level=INFO -m 'not slow' {posargs:tests/unit}
pass_env =
  REGISTRY_AUTH_FILE
  CI

[testenv:integration]
description = Run the slow Hugging Face, Podman, and Skopeo integration test
deps =
  -e .[dev]
commands = pytest -v --log-level=INFO -m slow {posargs:tests/integration}
pass_env =
  REGISTRY_AUTH_FILE
  CI

[testenv:isort]
deps =
  isort
commands =
  isort --gitignore --verbose --only-modified {[common]format_dirs}

[testenv:isort-lint]
deps =
  {[testenv:isort]deps}
commands =
  isort --check-only --diff --gitignore {[common]format_dirs}

[testenv:black]
depends =
  isort
deps =
  black
commands =
  black {[common]format_dirs}

[testenv:black-lint]
deps =
  {[testenv:black]deps}
commands =
  black --check --diff {[common]format_dirs}

[testenv:mypy]
deps =
  -e .[dev]
commands =
  mypy --ignore-missing-imports {toxinidir}/src {toxinidir}/tests

[testenv:pyright]
deps =
  -e .[dev]
commands =
  pyright

[testenv:flake8]
deps =
  flake8
commands =
  flake8 {posargs} {[common]format_dirs}

[testenv:lint]
deps =
  {[testenv:black]deps}
  {[testenv:isort]deps}
  {[testenv:flake8]deps}
commands =
  black --check {[common]format_dirs}
  isort --check-only --diff --gitignore {[common]format_dirs}
  flake8 {posargs} {[common]format_dirs}

[testenv:format]
deps =
  {[testenv:black]deps}
  {[testenv:isort]deps}
commands =
  isort --gitignore --verbose --only-modified {[common]format_dirs}
  black {[common]format_dirs}

[testenv:build]
deps =
  build
commands =
  python -c "import shutil; shutil.rmtree(r'{toxinidir}/dist', ignore_errors=True)"
  python -m build --outdir {toxinidir}/dist
  python {toxinidir}/scripts/wheel_smoke.py {toxinidir}/dist

[testenv:chart]
description = Lint and render the Helm chart
allowlist_externals =
  bash
commands =
  bash {toxinidir}/charts/modelcar-maker/tests/test-chart.sh

[flake8]
# E123, E125 skipped as they are invalid PEP-8.
show-source = True
ignore = E123,E125,E203,E402,E501,E741,F401,F811,F841,W503
max-line-length = 120
builtins = _
